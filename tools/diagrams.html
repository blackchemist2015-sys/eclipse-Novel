<!doctype html>
<html lang="ar" dir="ltr"><head><meta charset="utf-8">
<style>
@font-face { font-family: Amiri; src: url(../fonts/Amiri-Regular.ttf); }
@font-face { font-family: Amiri; font-weight: bold; src: url(../fonts/Amiri-Bold.ttf); }
@font-face { font-family: Kufi; src: url(../fonts/ReemKufi.ttf); }
body { margin: 0; background: #888; }
.plate { display: block; margin: 20px; }
svg text { font-family: Amiri; fill: #2b2118; unicode-bidi: plaintext; }
.lbl { font-size: 30px; }
.sm { font-size: 24px; }
.ttl { font-size: 40px; font-weight: bold; }
</style></head><body>

<!-- ============ abjad ============ -->
<svg class="plate" id="d_abjad" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f4ecd8"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#8a6a3a" stroke-width="3"/>
  <rect x="32" y="32" width="1536" height="836" fill="none" stroke="#8a6a3a" stroke-width="1"/>
  <text x="800" y="100" text-anchor="middle" class="ttl">حسابُ الجُمَّل الكبير: كلُّ حرفٍ عدد</text>
  <g id="ab-grid"></g>
  <g id="ab-sum"></g>
</svg>

<!-- ============ umbra / penumbra ============ -->
<svg class="plate" id="d_umbra" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f4ecd8"/>
  <text x="800" y="70" text-anchor="middle" class="ttl">«وكم عرضُ الخيال؟» — هندسةُ كسوف الشمس</text>
  <defs><radialGradient id="u-sun"><stop offset="0" stop-color="#fff2b0"/><stop offset="1" stop-color="#f0a52a"/></radialGradient></defs>
  <!-- penumbra region -->
  <path d="M1500,140 L700,420 L700,480 L1500,760 Z" fill="#c9bfa8" opacity=".55"/>
  <!-- umbra cone -->
  <path d="M700,422 L1330,452 L1330,448 Z" fill="#000"/>
  <path d="M700,422 L700,478 L1330,452 Z" fill="#3a3028"/>
  <!-- tangent lines -->
  <g stroke="#8a6a3a" stroke-width="1.5" stroke-dasharray="8 6" fill="none">
    <line x1="230" y1="250" x2="1500" y2="140"/><line x1="230" y1="650" x2="1500" y2="760"/>
    <line x1="230" y1="250" x2="1340" y2="460"/><line x1="230" y1="650" x2="1340" y2="440"/>
  </g>
  <circle cx="230" cy="450" r="200" fill="url(#u-sun)"/>
  <circle cx="700" cy="450" r="28" fill="#6d665c"/>
  <path d="M1600,150 C1380,300 1330,380 1328,450 C1330,520 1380,600 1600,750 Z" fill="#7aa0c8"/>
  <path d="M1336,420 C1333,440 1333,460 1336,480" stroke="#000" stroke-width="10" fill="none"/>
  <text x="230" y="720" text-anchor="middle" class="lbl">الشمس</text>
  <text x="700" y="390" text-anchor="middle" class="lbl">القمر</text>
  <text x="1500" y="830" text-anchor="middle" class="lbl">الأرض</text>
  <text x="1150" y="540" text-anchor="middle" class="lbl">الظلّ الكامل ← كسوفٌ كلّيّ</text>
  <text x="1130" y="300" text-anchor="middle" class="lbl">الظلّ الناقص ← كسوفٌ جزئيّ</text>
  <text x="1130" y="650" text-anchor="middle" class="lbl">الظلّ الناقص ← كسوفٌ جزئيّ</text>
  <text x="1200" y="420" text-anchor="end" class="sm">بقعةٌ عرضُها نحو ١٠٠–٢٧٠ كم</text>
  <text x="800" y="870" text-anchor="middle" class="sm">الرسم غيرُ مُلتزمٍ بالمقياس: الشمسُ أكبرُ من القمر بنحو ٤٠٠ مرّة وأبعدُ منه بنحو ٤٠٠ مرّة، ولهذا يتطابق قرصاهما في السماء.</text>
</svg>

<!-- ============ the basin ============ -->
<svg class="plate" id="d_basin" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f4ecd8"/>
  <text x="800" y="70" text-anchor="middle" class="ttl">«ونحن قومٌ ننظر في الطَّست» — رصدُ الكسوف بالانعكاس</text>
  <!-- eclipsed sun upper left -->
  <circle cx="220" cy="190" r="70" fill="#f0a52a"/><circle cx="262" cy="170" r="66" fill="#f4ecd8"/>
  <text x="220" y="300" text-anchor="middle" class="lbl">الشمس المنكسفة</text>
  <g stroke="#d48a1a" stroke-width="3"><line x1="270" y1="230" x2="760" y2="690"/><line x1="290" y1="210" x2="800" y2="690"/></g>
  <g stroke="#d48a1a" stroke-width="3" stroke-dasharray="10 6"><line x1="760" y1="690" x2="1230" y2="330"/><line x1="800" y1="690" x2="1250" y2="345"/></g>
  <!-- basin -->
  <path d="M600,690 L960,690 L920,760 L640,760 Z" fill="#3b3b40"/>
  <rect x="604" y="680" width="352" height="12" fill="#7aa0c8"/>
  <text x="780" y="810" text-anchor="middle" class="lbl">طَستٌ من نحاسٍ أسود، مملوءٌ ماءً ساكنًا</text>
  <!-- observer -->
  <g fill="#2b2118"><circle cx="1290" cy="300" r="46"/><path d="M1250,340 C1230,420 1240,560 1260,700 L1380,700 C1390,560 1370,420 1330,340 Z"/></g>
  <circle cx="1262" cy="306" r="5" fill="#f4ecd8"/>
  <text x="1310" y="760" text-anchor="middle" class="lbl">الراصد ينظر إلى الأسفل</text>
  <!-- warning -->
  <g transform="translate(560,190)"><rect x="-10" y="-50" width="560" height="120" rx="10" fill="#fff6e0" stroke="#b03a2e" stroke-width="3"/>
    <text x="270" y="0" text-anchor="middle" class="lbl" style="fill:#b03a2e">لا تنظر إلى الشمس بعينك أبدًا</text>
    <text x="270" y="45" text-anchor="middle" class="sm">ولا حتى وهي منكسفة: الضوءُ يحرق الشبكيّة بلا ألم</text></g>
  <!-- inset: crescents under a tree -->
  <g transform="translate(1440,560)"><circle r="120" fill="#e9dcc0" stroke="#8a6a3a" stroke-width="2"/>
    <g id="bs-cres"></g>
    <text y="160" text-anchor="middle" class="sm">أهلّةُ الضوء تحت الشجرة</text></g>
</svg>

<!-- ============ Venus–Mercury conjunction, 19 May 1000 ============ -->
<svg class="plate" id="d_conj" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="cj-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1330"/><stop offset=".6" stop-color="#2d3a6a"/><stop offset=".85" stop-color="#b86a4a"/><stop offset="1" stop-color="#f0b36a"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#cj-sky)"/>
  <g id="cj-stars"></g>
  <path d="M0,780 C260,770 420,790 700,776 C980,764 1200,790 1600,778 L1600,900 L0,900 Z" fill="#141018"/>
  <g fill="#141018"><rect x="1180" y="700" width="18" height="90"/><path d="M1176,700 L1189,664 L1202,700 Z"/>
    <path d="M300,780 L300,740 A40,40 0 0 1 380,740 L380,780 Z"/><path d="M880,790 L905,700 L915,700 L940,790 Z"/></g>
  <!-- Gemini -->
  <g id="cj-gem"></g>
  <circle cx="760" cy="560" r="10" fill="#fff"/><circle cx="772" cy="586" r="4" fill="#ffe2b8"/>
  <circle cx="766" cy="573" r="26" fill="none" stroke="#e6ecff" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="700" y="555" text-anchor="end" style="font-size:30px;fill:#fff">الزهرة</text>
  <text x="720" y="610" text-anchor="end" style="font-size:26px;fill:#ffe2b8">عطارد</text>
  <text x="830" y="520" style="font-size:22px;fill:#dfe6ff">أقلُّ من قُطر القمر</text>
  <text x="800" y="70" text-anchor="middle" style="font-size:38px;font-weight:bold;fill:#f6e6c2">قِرانُ الزهرة وعطارد — مساء الأحد ١١ جمادى الآخرة ٣٩٠هـ / ١٩ مايو ١٠٠٠م</text>
  <text x="800" y="860" text-anchor="middle" style="font-size:24px;fill:#e8d3a8">الأفق الغربيّ من خرابة الفسطاط بعد الغروب — رسمٌ توضيحيٌّ تقريبيّ لرصدٍ دوّنه ابنُ يونس في زيجه</text>
</svg>

<!-- ============ Saros ============ -->
<svg class="plate" id="d_saros" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4ecd8"/>
  <text x="800" y="70" text-anchor="middle" class="ttl">«الطيّة»: دورةُ الكسوف (الساروس) وانزلاقُ الظلّ</text>
  <g transform="translate(470,540)">
    <circle r="330" fill="#d9e4ef" stroke="#2b2118" stroke-width="3"/>
    <g id="sr-grid"></g>
    <g id="sr-tracks"></g>
    <circle r="7" fill="#2b2118"/><text y="30" text-anchor="middle" class="sm">القطب</text>
  </g>
  <g transform="translate(980,180)" class="lbl">
    <rect x="-20" y="-50" width="600" height="700" fill="#fbf6ea" stroke="#8a6a3a" stroke-width="2"/>
    <text x="560" y="0" text-anchor="end" style="font-weight:bold">مدّةُ الطيّة الواحدة</text>
    <text x="560" y="45" text-anchor="end">١٨ سنة + ١١ يومًا + ⅓ يوم</text>
    <text x="560" y="85" text-anchor="end" class="sm">= ٢٢٣ شهرًا قمريًّا ≈ ٦٥٨٥٫٣٢ يومًا</text>
    <text x="560" y="150" text-anchor="end" style="font-weight:bold">لماذا ينزلق الظلّ؟</text>
    <text x="560" y="195" text-anchor="end" class="sm">ثُلثُ اليوم الزائد (نحو ٨ ساعات) تدور فيه</text>
    <text x="560" y="230" text-anchor="end" class="sm">الأرضُ ١٢٠°، فيقع الكسوفُ التالي غربَ سابقه</text>
    <text x="560" y="265" text-anchor="end" class="sm">بثُلث محيط الأرض.</text>
    <text x="560" y="330" text-anchor="end" style="font-weight:bold">ثلاثُ طيّات</text>
    <text x="560" y="375" text-anchor="end">٥٤ سنة + ٣٣ يومًا</text>
    <text x="560" y="415" text-anchor="end" class="sm">يعود بعدها الظلُّ إلى خطّ الطول نفسه تقريبًا،</text>
    <text x="560" y="450" text-anchor="end" class="sm">لكن منحرفًا شمالًا أو جنوبًا — «مسيرةَ أيام».</text>
    <text x="560" y="520" text-anchor="end" style="font-weight:bold">في الرواية</text>
    <text x="560" y="560" text-anchor="end" class="sm">عرفها خاي ١٣٣٨ ق.م، وحسب بها سيفُ بن سلامة</text>
    <text x="560" y="595" text-anchor="end" class="sm">في الهرم ٤٠٢هـ، وحسب بها سيف المصري ٢٠٢٧م.</text>
  </g>
</svg>

<!-- ============ Great Pyramid ============ -->

  <rect width="1600" height="1100" fill="#f4ecd8"/>
  <text x="330" y="140" text-anchor="middle" class="ttl">مقطعٌ في الهرم الأكبر وثَقبُ المأمون</text>
  <line x1="40" y1="860" x2="1560" y2="860" stroke="#8a6a3a" stroke-width="2"/>
  <path d="M100,860 L750,32 L1400,860 Z" fill="#e2cfa5" stroke="#2b2118" stroke-width="3"/>
  <path d="M100,860 L750,32 L1400,860" fill="none" stroke="#fffaf0" stroke-width="10" opacity=".9"/>
  <g stroke="#2b2118" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M175,764 L708,1030"/>
    <path d="M317,835 L515,738"/>
    <path d="M515,741 L730,741"/>
  </g>
  <path d="M515,738 L753,622 L753,574 L515,690 Z" fill="#b89a66" stroke="#2b2118" stroke-width="2"/>
  <rect x="760" y="584" width="60" height="33" fill="#9a4a3a" stroke="#2b2118" stroke-width="2"/>
  <rect x="730" y="712" width="32" height="29" fill="#b89a66" stroke="#2b2118" stroke-width="2"/>
  <rect x="680" y="1010" width="80" height="30" fill="#8a7a62" stroke="#2b2118" stroke-width="2"/>
  <path d="M131,820 L170,826 L205,818 L245,830 L285,828 L317,835" stroke="#b03a2e" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g class="sm">
    <text x="230" y="740" text-anchor="end">المدخلُ الأصليّ</text>
    <text x="300" y="900" text-anchor="middle" style="fill:#b03a2e">ثَقبُ المأمون (نحو ٢١٢هـ / ٨٢٠م) — مدخلُ الزوّار اليوم</text>
    <text x="470" y="1000" text-anchor="middle">الممرّ النازل</text>
    <text x="760" y="1070" text-anchor="middle">الحجرة السفليّة غيرُ المكتملة</text>
    <text x="380" y="760" text-anchor="middle">الممرّ الصاعد</text>
    <text x="560" y="620" text-anchor="middle">البهو العظيم (≈ ٤٧م × ٨٫٦م)</text>
    <text x="900" y="570" text-anchor="start">حجرة الملك (جرانيت أحمر) — «فارغةٌ منذ ألفَي سنة قبل المأمون»</text>
    <text x="780" y="790" text-anchor="start">حجرة الملكة</text>
    <text x="1330" y="700" text-anchor="middle">الكِساء الأبيض الأملس</text>
    <text x="1330" y="735" text-anchor="middle">(قُلع بعد زلزال ٧٠٢هـ / ١٣٠٣م)</text>
    <text x="1300" y="950" text-anchor="middle">الارتفاع الأصليّ ≈ ١٤٦٫٦م · القاعدة ≈ ٢٣٠م</text>
  </g>
</svg>

<!-- ============ 2027 map ============ -->
<svg class="plate" id="d_map" width="1600" height="1250" viewBox="0 0 1600 1250">
  <rect width="1600" height="1250" fill="#cfe0ec"/>
  <g id="mp"></g>
  <text x="800" y="60" text-anchor="middle" class="ttl">مسارُ الظلّ الكامل — الإثنين ٢ أغسطس ٢٠٢٧م / ٢٩ صفر ١٤٤٩هـ</text>
  <text x="800" y="1225" text-anchor="middle" class="sm">خريطةٌ توضيحيّةٌ تقريبيّة. عرضُ المسار ≈ ٢٥٨ كم · أطولُ مدّةٍ للظلام ٦ دقائق و٢٣ ثانية قرب الأقصر.</text>
</svg>

<script src="common.js"></script>
<script>
// ---- abjad grid
(function () {
  const vals = [['أ',1],['ب',2],['ج',3],['د',4],['ه',5],['و',6],['ز',7],['ح',8],['ط',9],['ي',10],['ك',20],['ل',30],['م',40],['ن',50],['س',60],['ع',70],['ف',80],['ص',90],['ق',100],['ر',200],['ش',300],['ت',400],['ث',500],['خ',600],['ذ',700],['ض',800],['ظ',900],['غ',1000]];
  const hl = { 'م': 1, 'ن': 1, 'ص': 1, 'و': 1, 'ر': 1 };
  const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const g = document.getElementById('ab-grid');
  vals.forEach(([c, v], i) => {
    const col = i % 14, row = Math.floor(i / 14), x = 1460 - col * 101, y = 150 + row * 170;
    const on = hl[c];
    el(g, 'rect', { x: x - 44, y, width: 88, height: 140, rx: 8, fill: on ? '#e9c46a' : '#fbf6ea', stroke: '#8a6a3a', 'stroke-width': on ? 3 : 1.5 });
    el(g, 'text', { x, y: y + 70, 'text-anchor': 'middle', 'font-size': 56, 'font-weight': 'bold' }, c);
    el(g, 'text', { x, y: y + 120, 'text-anchor': 'middle', 'font-size': 30, fill: '#7a4a1a' }, ar(v));
  });
  el(g, 'text', { x: 800, y: 545, 'text-anchor': 'middle', 'font-size': 26 }, 'الترتيب: أبجد · هوّز · حطّي · كلمن · سعفص · قرشت · ثخذ · ضظغ');
  const s = document.getElementById('ab-sum');
  const parts = [['م', 40], ['ن', 50], ['ص', 90], ['و', 6], ['ر', 200]];
  let x = 1320;
  parts.forEach(([c, v], i) => {
    el(s, 'text', { x, y: 680, 'text-anchor': 'middle', 'font-size': 70, 'font-weight': 'bold' }, c);
    el(s, 'text', { x, y: 740, 'text-anchor': 'middle', 'font-size': 36, fill: '#7a4a1a' }, ar(v));
    if (i < 4) el(s, 'text', { x: x - 80, y: 740, 'text-anchor': 'middle', 'font-size': 36 }, '+');
    x -= 160;
  });
  el(s, 'text', { x: x + 20, y: 740, 'text-anchor': 'middle', 'font-size': 44, 'font-weight': 'bold' }, '= ٣٨٦');
  el(s, 'text', { x: 800, y: 830, 'text-anchor': 'middle', 'font-size': 34, fill: '#7a2a1a' }, 'مَنصور = ٣٨٦ = سنةُ بيعة الحاكم بأمر الله (٣٨٦هـ)');
})();

// ---- crescents inset
(function () {
  const g = document.getElementById('bs-cres'), r = rng(3);
  for (let i = 0; i < 26; i++) {
    const a = r() * 2 * Math.PI, d = Math.sqrt(r()) * 95, x = d * Math.cos(a), y = d * Math.sin(a), s = 7 + r() * 6;
    el(g, 'circle', { cx: x, cy: y, r: s, fill: '#f4c46a' }); el(g, 'circle', { cx: x + s * .45, cy: y - s * .25, r: s * .92, fill: '#e9dcc0' });
  }
})();

// ---- conjunction sky
(function () {
  stars(document.getElementById('cj-stars'), 140, 0, 0, 1600, 520, 77, 1.5);
  const g = document.getElementById('cj-gem');
  const pts = { castor: [560, 330], pollux: [620, 360], a: [520, 420], b: [600, 440], c: [480, 520], d: [580, 520] };
  [['castor', 'a'], ['a', 'c'], ['pollux', 'b'], ['b', 'd'], ['a', 'b']].forEach(([p, q]) => el(g, 'line', { x1: pts[p][0], y1: pts[p][1], x2: pts[q][0], y2: pts[q][1], stroke: '#aebbe6', 'stroke-width': 1.2, opacity: .6 }));
  Object.values(pts).forEach(([x, y], i) => el(g, 'circle', { cx: x, cy: y, r: i < 2 ? 4.5 : 3, fill: '#eef2ff' }));
  el(g, 'text', { x: 470, y: 300, 'font-size': 26, fill: '#cfd8ff' }, 'التوأمان (الجوزاء عند المتأخرين)');
  // Orion setting at the horizon (the boy's "door with three in the middle")
  const o = [[1040, 600], [1180, 610], [1060, 740], [1190, 750]], belt = [[1090, 680], [1115, 676], [1140, 672]];
  [[0, 1], [0, 2], [1, 3], [2, 3]].forEach(([p, q]) => el(g, 'line', { x1: o[p][0], y1: o[p][1], x2: o[q][0], y2: o[q][1], stroke: '#aebbe6', 'stroke-width': 1.2, opacity: .5 }));
  o.concat(belt).forEach(([x, y]) => el(g, 'circle', { cx: x, cy: y, r: 3.5, fill: '#eef2ff' }));
  el(g, 'text', { x: 1250, y: 640, 'font-size': 24, fill: '#cfd8ff' }, '«أربعة على شكل باب وفي نُصّها تلاتة»');
})();

// ---- saros globe
(function () {
  const gr = document.getElementById('sr-grid');
  [110, 220].forEach(r => el(gr, 'circle', { r, fill: 'none', stroke: '#9fb3c8', 'stroke-width': 1 }));
  for (let d = 0; d < 360; d += 30) { const a = d * Math.PI / 180; el(gr, 'line', { x1: 0, y1: 0, x2: 330 * Math.cos(a), y2: 330 * Math.sin(a), stroke: '#9fb3c8', 'stroke-width': 1 }); }
  const tr = document.getElementById('sr-tracks');
  const cols = ['#b03a2e', '#c98a1a', '#3a6a9a', '#7a2a6a'];
  const lab = ['كسوفٌ (أ)', 'بعد طيّة: ١٢٠° غربًا', 'بعد طيّتين: ٢٤٠°', 'بعد ثلاث طيّات: قرب (أ) منحرفًا'];
  [0, 120, 240, 352].forEach((rot, i) => {
    const g = el(tr, 'g', { transform: `rotate(${-rot})` });
    const rr = i === 3 ? 18 : 0;
    el(g, 'path', { d: `M${150 + rr},-250 C${230 + rr},-180 ${250 + rr},-80 ${235 + rr},20`, stroke: cols[i], 'stroke-width': 18, fill: 'none', opacity: .75, 'stroke-linecap': 'round' });
    const a = (-rot - 40) * Math.PI / 180;
    el(tr, 'text', { x: 385 * Math.cos(a), y: 385 * Math.sin(a), 'text-anchor': 'middle', 'font-size': 22, fill: cols[i] }, lab[i]);
  });
  el(tr, 'path', { d: 'M0,-300 A300,300 0 0 0 -260,-150', stroke: '#2b2118', 'stroke-width': 2, fill: 'none', 'marker-end': '' });
})();

// ---- map 2027
(function () {
  const g = document.getElementById('mp');
  const L0 = 24, L1 = 41, B0 = 19.5, B1 = 32.5, X0 = 60, X1 = 1540, Y0 = 100, Y1 = 1180;
