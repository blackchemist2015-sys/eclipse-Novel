<script src="common.js"></script>
<script>
// ---------- cover
(function () {
  const svg = document.getElementById('cover');
  stars(document.getElementById('cv-stars'), 260, 0, 0, 1200, 1100, 7, 1.9);
  const ring = document.getElementById('cv-ring');
  el(ring, 'circle', { cx: 600, cy: 600, r: 470, fill: 'none', stroke: '#c9a25a', 'stroke-width': 2, opacity: .55 });
  el(ring, 'circle', { cx: 600, cy: 600, r: 452, fill: 'none', stroke: '#c9a25a', 'stroke-width': 1, opacity: .45 });
  for (let d = 0; d < 360; d += 2) {
    const a = d * Math.PI / 180, r1 = 452, r2 = d % 10 === 0 ? 432 : 442;
    el(ring, 'line', { x1: 600 + r1 * Math.cos(a), y1: 600 + r1 * Math.sin(a), x2: 600 + r2 * Math.cos(a), y2: 600 + r2 * Math.sin(a), stroke: '#c9a25a', 'stroke-width': d % 10 === 0 ? 1.6 : .8, opacity: .55 });
  }
  const abjad = 'أبجدهوزحطيكلمنسعفصقرشتثخذضظغ'.split('');
  abjad.forEach((ch, i) => {
    const a = (i / abjad.length) * 2 * Math.PI - Math.PI / 2;
    el(ring, 'text', { x: 600 + 495 * Math.cos(a), y: 600 + 495 * Math.sin(a) + 10, 'text-anchor': 'middle', 'font-size': 28, fill: '#c9a25a', opacity: ['م','ن','ص','و','ر'].includes(ch) ? 1 : .45 }, ch);
  });
  const rays = document.getElementById('cv-rays'); const r = rng(11);
  for (let i = 0; i < 140; i++) {
    const a = r() * 2 * Math.PI, L = 170 + Math.pow(r(), 2) * (r() < .15 ? 420 : 210), w = .6 + r() * 2.2;
    el(rays, 'line', { x1: 600 + 150 * Math.cos(a), y1: 600 + 150 * Math.sin(a), x2: 600 + L * Math.cos(a), y2: 600 + L * Math.sin(a), stroke: '#f4f0ff', 'stroke-width': w, opacity: .18 + r() * .35, 'stroke-linecap': 'round' });
  }
  // skyline of minarets and domes
  const sk = document.getElementById('cv-sky-line'); const q = rng(5);
  el(sk, 'path', { d: 'M0,1120 L1200,1120 L1200,1800 L0,1800 Z', fill: '#05060b' });
  let x = 0;
  while (x < 1200) {
    const t = q();
    if (t < .3) { const w = 70 + q() * 60, h = 30 + q() * 30; el(sk, 'path', { d: `M${x},1120 L${x},${1120 - h} A${w / 2},${w / 2} 0 0 1 ${x + w},${1120 - h} L${x + w},1120 Z`, fill: '#05060b' }); x += w + 10; }
    else if (t < .55) { const h = 130 + q() * 150; el(sk, 'rect', { x, y: 1120 - h, width: 22, height: h, fill: '#05060b' }); el(sk, 'path', { d: `M${x - 3},${1120 - h} L${x + 11},${1120 - h - 40} L${x + 25},${1120 - h} Z`, fill: '#05060b' }); el(sk, 'rect', { x: x - 6, y: 1120 - h * .62, width: 34, height: 8, fill: '#05060b' }); x += 50; }
    else { const w = 60 + q() * 90, h = 40 + q() * 50; el(sk, 'rect', { x, y: 1120 - h, width: w, height: h, fill: '#05060b' }); if (q() < .5) el(sk, 'rect', { x: x + w * .4, y: 1120 - h * .6, width: 6, height: 9, fill: '#e2a24a', opacity: .8 }); x += w + 4; }
  }
})();

// ---------- birth night
(function () {
  stars(document.getElementById('b-stars'), 220, 0, 0, 1600, 520, 3);
  const c = document.getElementById('b-city'), r = rng(9);
  el(c, 'rect', { x: 880, y: 600, width: 720, height: 70, fill: '#0b0d16' });
  for (let x = 880; x < 1600; x += 18) el(c, 'rect', { x, y: 590, width: 10, height: 12, fill: '#0b0d16' });
  [940, 1080, 1230, 1380, 1520].forEach(x => el(c, 'rect', { x, y: 560, width: 44, height: 110, fill: '#0b0d16' }));
